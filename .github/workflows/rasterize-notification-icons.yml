name: Rasterize notification icons

on:
  push:
    branches:
      - chore/rasterize-notification-assets

jobs:
  rasterize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-save sharp@0.34.4
      - name: Generate notification PNGs
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises'
          import path from 'node:path'
          import sharp from 'sharp'

          const root = process.cwd()
          const sourceDir = path.join(root, 'public', 'icons')
          const dogs = ['d1', 'd2', 'd3', 'd4']
          const positions = [
            { left: 8, top: 8 },
            { left: 258, top: 8 },
            { left: 8, top: 258 },
            { left: 258, top: 258 },
          ]

          const composites = await Promise.all(dogs.map(async (dog, index) => ({
            input: await sharp(path.join(sourceDir, `logo-${dog}.png`))
              .resize(246, 246, { fit: 'cover', position: 'centre' })
              .png()
              .toBuffer(),
            ...positions[index],
          })))

          const base = await sharp({
            create: {
              width: 512,
              height: 512,
              channels: 4,
              background: '#0b0715',
            },
          }).composite(composites).png().toBuffer()

          const master = await sharp(base)
            .composite([
              {
                input: Buffer.from(
                  '<svg width="512" height="512" xmlns="http://www.w3.org/2000/svg"><rect width="512" height="512" rx="56" fill="white"/></svg>',
                ),
                blend: 'dest-in',
              },
              {
                input: Buffer.from(
                  '<svg width="512" height="512" xmlns="http://www.w3.org/2000/svg"><rect x="2" y="2" width="508" height="508" rx="54" fill="none" stroke="#67e8f9" stroke-width="4"/></svg>',
                ),
                blend: 'over',
              },
            ])
            .png()
            .toBuffer()

          await sharp(master)
            .resize(192, 192)
            .png({ compressionLevel: 9 })
            .toFile(path.join(sourceDir, 'icon-notification-192.png'))

          const { data, info } = await sharp(master)
            .removeAlpha()
            .resize(96, 96)
            .grayscale()
            .raw()
            .toBuffer({ resolveWithObject: true })

          const out = Buffer.alloc(info.width * info.height * 4)
          for (let i = 0; i < info.width * info.height; i += 1) {
            const luminance = data[i]
            const alpha = luminance > 24 ? 255 : 0
            const offset = i * 4
            out[offset] = 255
            out[offset + 1] = 255
            out[offset + 2] = 255
            out[offset + 3] = alpha
          }

          await sharp(out, {
            raw: {
              width: info.width,
              height: info.height,
              channels: 4,
            },
          }).png({ compressionLevel: 9 }).toFile(
            path.join(sourceDir, 'badge-notification-96.png'),
          )
          NODE
      - name: Commit generated PNGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/icons/icon-notification-192.png public/icons/badge-notification-96.png
          if git diff --cached --quiet; then
            echo "Notification icons are unchanged."
            exit 0
          fi
          git commit -m "chore: generate notification icon PNGs"
          git push
